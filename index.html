<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Pong Migliorato</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

canvas {
    border: 4px solid white;
    box-shadow: 0 0 20px rgba(0,255,255,0.3);
}
</style>
</head>

<body>

<canvas id="pongCanvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("pongCanvas");
const ctx = canvas.getContext("2d");

// LIVELLI (finalmente bilanciati)
const levels = {
    easy:   { aiSpeed: 2.5, error: 60, reaction: 0.03 },
    medium: { aiSpeed: 4,   error: 35, reaction: 0.06 },
    hard:   { aiSpeed: 5.5, error: 15, reaction: 0.1 }
};

let currentLevel = "medium";

// PALLA
const ball = {
    x: 400,
    y: 200,
    radius: 10,
    velocityX: 5,
    velocityY: 3,
    speed: 5,
    trail: []
};

// GIOCATORE
const user = {
    x: 0,
    y: 150,
    width: 12,
    height: 100,
    score: 0,
    color: "#00ffcc"
};

// IA
const com = {
    x: 788,
    y: 150,
    width: 12,
    height: 100,
    score: 0,
    color: "#ff4d6d"
};

// CONTROLLO
canvas.addEventListener("mousemove", e => {
    let rect = canvas.getBoundingClientRect();
    user.y = e.clientY - rect.top - user.height / 2;
});

// DISEGNO
function drawRect(x,y,w,h,color){
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillRect(x,y,w,h);
    ctx.shadowBlur = 0;
}

function drawBall(){
    // trail
    for(let i=0;i<ball.trail.length;i++){
        let t = ball.trail[i];
        ctx.fillStyle = "rgba(0,245,255," + (i/ball.trail.length) + ")";
        ctx.beginPath();
        ctx.arc(t.x,t.y,ball.radius,0,Math.PI*2);
        ctx.fill();
    }

    ctx.fillStyle = "#00f5ff";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
    ctx.fill();
}

function drawNet(){
    for(let i=0;i<canvas.height;i+=25){
        drawRect(canvas.width/2-1,i,2,12,"#aaa");
    }
}

function drawText(text,x,y){
    ctx.fillStyle="white";
    ctx.font="30px Arial";
    ctx.fillText(text,x,y);
}

// RESET
function resetBall(){
    ball.x=400;
    ball.y=200;
    ball.velocityX*=-1;
    ball.speed=5;
    ball.trail=[];
}

// COLLISION
function collision(b,p){
    return b.x-b.radius < p.x+p.width &&
           b.x+b.radius > p.x &&
           b.y-b.radius < p.y+p.height &&
           b.y+b.radius > p.y;
}

// UPDATE
function update(){

    // punteggio
    if(ball.x<0){ com.score++; resetBall(); }
    if(ball.x>canvas.width){ user.score++; resetBall(); }

    // movimento palla
    ball.x += ball.velocityX;
    ball.y += ball.velocityY;

    // trail
    ball.trail.push({x:ball.x,y:ball.y});
    if(ball.trail.length>10) ball.trail.shift();

    // rimbalzo
    if(ball.y<0 || ball.y>canvas.height){
        ball.velocityY*=-1;
    }

    // IA REALISTICA
    let level = levels[currentLevel];

    let target = ball.y - com.height/2;

    // errore reale
    target += (Math.random()*level.error - level.error/2);

    // ritardo di reazione
    let diff = target - com.y;
    com.y += diff * level.reaction;

    // limite velocità
    if(diff > level.aiSpeed) com.y += level.aiSpeed;
    if(diff < -level.aiSpeed) com.y -= level.aiSpeed;

    // collisione
    let player = ball.x < canvas.width/2 ? user : com;

    if(collision(ball,player)){
        let collidePoint = ball.y - (player.y+player.height/2);
        collidePoint /= (player.height/2);

        let angle = collidePoint * Math.PI/4;
        let direction = ball.x < canvas.width/2 ? 1 : -1;

        ball.velocityX = direction * ball.speed * Math.cos(angle);
        ball.velocityY = ball.speed * Math.sin(angle);

        ball.speed += 0.3;
    }
}

// RENDER
function render(){

    // sfondo
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawNet();

    drawText(user.score,200,40);
    drawText(com.score,600,40);
    drawText("Livello: "+currentLevel,20,20);

    drawRect(user.x,user.y,user.width,user.height,user.color);
    drawRect(com.x,com.y,com.width,com.height,com.color);

    drawBall();
}

// LOOP
function game(){
    update();
    render();
}

setInterval(game,1000/60);

// CAMBIO LIVELLO
document.addEventListener("keydown", e=>{
    if(e.key==="1") currentLevel="easy";
    if(e.key==="2") currentLevel="medium";
    if(e.key==="3") currentLevel="hard";
});
</script>

</body>
</html>
