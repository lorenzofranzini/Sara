<script>
const canvas = document.getElementById("pongCanvas");
const ctx = canvas.getContext("2d");

// LIVELLI DI DIFFICOLTÀ
const levels = {
    easy: { aiSpeed: 3, error: 30 },
    medium: { aiSpeed: 5, error: 15 },
    hard: { aiSpeed: 7, error: 5 }
};

let currentLevel = "medium";

// OGGETTI
const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 10,
    velocityX: 5,
    velocityY: 5,
    speed: 6,
    color: "#00f5ff"
};

const user = {
    x: 0,
    y: canvas.height / 2 - 50,
    width: 12,
    height: 100,
    score: 0,
    color: "#00ff88"
};

const com = {
    x: canvas.width - 12,
    y: canvas.height / 2 - 50,
    width: 12,
    height: 100,
    score: 0,
    color: "#ff3864"
};

const net = {
    x: canvas.width / 2 - 1,
    width: 2,
    color: "#555"
};

// DISEGNO
function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillRect(x, y, w, h);
    ctx.shadowBlur = 0;
}

function drawBall() {
    ctx.beginPath();
    ctx.fillStyle = ball.color;
    ctx.shadowColor = ball.color;
    ctx.shadowBlur = 20;
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawNet() {
    for (let i = 0; i < canvas.height; i += 20) {
        drawRect(net.x, i, net.width, 10, net.color);
    }
}

function drawText(text, x, y) {
    ctx.fillStyle = "#fff";
    ctx.font = "40px Arial";
    ctx.fillText(text, x, y);
}

// MOUSE CONTROL
canvas.addEventListener("mousemove", evt => {
    let rect = canvas.getBoundingClientRect();
    user.y = evt.clientY - rect.top - user.height / 2;
});

// RESET
function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.velocityX *= -1;
    ball.speed = 6;
}

// COLLISION
function collision(b, p) {
    return b.x - b.radius < p.x + p.width &&
           b.x + b.radius > p.x &&
           b.y - b.radius < p.y + p.height &&
           b.y + b.radius > p.y;
}

// UPDATE
function update() {
    // PUNTEGGIO
    if (ball.x < 0) {
        com.score++;
        resetBall();
    } else if (ball.x > canvas.width) {
        user.score++;
        resetBall();
    }

    ball.x += ball.velocityX;
    ball.y += ball.velocityY;

    // RIMBALZO
    if (ball.y < 0 || ball.y > canvas.height) {
        ball.velocityY *= -1;
    }

    // IA MIGLIORATA (con errore)
    let level = levels[currentLevel];
    let target = ball.y - (com.height / 2);

    // errore casuale
    target += (Math.random() * level.error * 2) - level.error;

    // movimento limitato (no teleport)
    if (com.y < target) {
        com.y += level.aiSpeed;
    } else {
        com.y -= level.aiSpeed;
    }

    // collisione
    let player = (ball.x < canvas.width / 2) ? user : com;

    if (collision(ball, player)) {
        let collidePoint = ball.y - (player.y + player.height / 2);
        collidePoint /= (player.height / 2);

        let angle = collidePoint * Math.PI / 4;
        let direction = (ball.x < canvas.width / 2) ? 1 : -1;

        ball.velocityX = direction * ball.speed * Math.cos(angle);
        ball.velocityY = ball.speed * Math.sin(angle);

        ball.speed += 0.3;
    }
}

// RENDER
function render() {
    // sfondo gradient
    let grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    grad.addColorStop(0, "#0f2027");
    grad.addColorStop(1, "#203a43");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawNet();
    drawText(user.score, canvas.width / 4, 50);
    drawText(com.score, 3 * canvas.width / 4, 50);

    drawRect(user.x, user.y, user.width, user.height, user.color);
    drawRect(com.x, com.y, com.width, com.height, com.color);

    drawBall();
}

// GAME LOOP
function game() {
    update();
    render();
}

setInterval(game, 1000 / 60);

// CAMBIO LIVELLO CON TASTI
document.addEventListener("keydown", e => {
    if (e.key === "1") currentLevel = "easy";
    if (e.key === "2") currentLevel = "medium";
    if (e.key === "3") currentLevel = "hard";
});
</script>
